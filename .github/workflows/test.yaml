# Runs the test suite and basic Go checks on every push and pull request.
name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The provider tests (terraform-plugin-testing) require the Terraform CLI
      # on PATH. Without it they try to auto-install, which fails signature
      # verification ("openpgp: key expired") due to HashiCorp's rotated key.
      # Pre-installing Terraform lets the tests use it directly.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Gofmt
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then
            echo "These files are not formatted (run 'make fmt'):"
            echo "$out"
            exit 1
          fi
      - name: Test
        run: make test
